# CI for this repository. Require the single "ci" check on main: it fails unless
# every other job succeeded, so job names can change without touching the ruleset.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pytest
        run: python -m pip install pytest==9.1.1
      - name: Run tests (no network access needed)
        run: python -m pytest tests -q -p no:cacheprovider

  skills:
    name: plugin and SKILL.md check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - run: python scripts/check_skills.py

  personal-data:
    name: personal-data scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0  # the commit scan needs the pull request's commits
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - name: Scan files
        if: github.event_name != 'pull_request'
        run: python tests/pii_scan.py
      - name: Scan files and pull-request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python tests/pii_scan.py --commits "$BASE_SHA..$HEAD_SHA"

  ci:
    name: ci
    if: always()
    needs: [tests, skills, personal-data]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        env:
          TESTS: ${{ needs.tests.result }}
          SKILLS: ${{ needs.skills.result }}
          SCAN: ${{ needs.personal-data.result }}
        run: |
          echo "tests: $TESTS, skills: $SKILLS, personal-data scan: $SCAN"
          test "$TESTS" = success && test "$SKILLS" = success && test "$SCAN" = success
