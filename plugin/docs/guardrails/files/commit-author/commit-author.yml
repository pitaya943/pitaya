# pitaya template 0.1.0 · docs/guardrails/files/commit-author/commit-author.yml
# Fails a pull request with a commit not authored by the machine account (by GitHub login).
# Copy to .github/workflows/commit-author.yml, and check_commit_author.py to .github/guardrails/check_commit_author.py.
# Set the repository variables MACHINE_ACCOUNT (the agents' login) and OWNER_ACCOUNTS (the Owner's), then
# make the "commit-author" check required on main in the ruleset.
name: commit-author

on:
  pull_request:

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  commit-author:
    name: commit-author
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Load the checks from the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Run the base branch's copy of each check, so a pull request can't change the check
          # that judges it. The PR's own copy is used only while the base has none yet: the PR
          # that adds this guardrail.
          mkdir -p "$RUNNER_TEMP/guardrails"
          for f in check_commit_author.py; do
            git show "origin/$BASE_REF:.github/guardrails/$f" > "$RUNNER_TEMP/guardrails/$f" 2>/dev/null \
              || cp ".github/guardrails/$f" "$RUNNER_TEMP/guardrails/$f"
          done
      - name: Fetch the pull request's commits
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/commits" --paginate --jq '.[]' | jq -s . > "$RUNNER_TEMP/commits.json"
      - name: Who opened it
        id: who
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          OWNER_ACCOUNTS: ${{ vars.OWNER_ACCOUNTS }}
        run: |
          # Owner accounts (comma separated, any case) are skipped; every other author is checked.
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]' | tr -d ' '; }
          case ",$(lower "$OWNER_ACCOUNTS")," in
            *",$(lower "$PR_AUTHOR"),"*) [ -n "$OWNER_ACCOUNTS" ] && echo "owner=true" >> "$GITHUB_OUTPUT" ;;
          esac
      - name: Check the authors
        # Skipped only for pull requests an Owner account opened.
        if: steps.who.outputs.owner != 'true'
        # --also-allow: logins allowed besides the machine account, such as the Owner's for "Update branch" merges.
        run: >-
          python3 "$RUNNER_TEMP/guardrails/check_commit_author.py"
          --expected "${{ vars.MACHINE_ACCOUNT }}"
          --commits "$RUNNER_TEMP/commits.json"
          --also-allow ""
