# pitaya template 0.1.10 · docs/guardrails/files/progress-file/progress-file.yml
# Fails a pull request that changes the feature list beyond the "passes" flags.
# Copy to .github/workflows/progress-file.yml, and check_feature_list.py to .github/guardrails/check_feature_list.py.
# Set the repository variable MACHINE_ACCOUNT to the agents' login, then
# make the "progress-file" check required on main in the ruleset.
name: progress-file

on:
  pull_request:

permissions:
  contents: read

jobs:
  progress-file:
    name: progress-file
    runs-on: ubuntu-24.04
    # Runs on every pull request, so it can be a required check. The Owner edits requirements
    # in their own pull requests; everyone else may only flip "passes".
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0
      - name: Load the checks from the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Run the base branch's copy of each check, so a pull request can't change the check
          # that judges it. The PR's own copy is used only while the base has none yet: the PR
          # that adds this guardrail.
          mkdir -p "$RUNNER_TEMP/guardrails"
          for f in check_feature_list.py; do
            git show "origin/$BASE_REF:.github/guardrails/$f" > "$RUNNER_TEMP/guardrails/$f" 2>/dev/null \
              || cp ".github/guardrails/$f" "$RUNNER_TEMP/guardrails/$f"
          done
      - name: Check the feature list
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          MACHINE_ACCOUNT: ${{ vars.MACHINE_ACCOUNT }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ -z "${MACHINE_ACCOUNT:-}" ]; then
            echo "FAIL: the repository variable MACHINE_ACCOUNT is not set, so agents' PRs can't be told from people's."
            echo "To fix: set MACHINE_ACCOUNT (Settings, Secrets and variables, Actions, Variables) to the agents' login."
            exit 1
          fi
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]' | tr -d ' '; }
          case ",$(lower "$MACHINE_ACCOUNT")," in
            *",$(lower "$PR_AUTHOR"),"*) ;;
            *) echo "Opened by a person: requirements may change."; exit 0 ;;
          esac
          if git diff --quiet "origin/$BASE_REF...HEAD" -- docs/progress/features.json; then
            echo "The feature list didn't change."; exit 0
          fi
          git show "origin/$BASE_REF:docs/progress/features.json" > "$RUNNER_TEMP/base.json"
          # What the default branch says was merged by the Owner; a sync PR brings it into a milestone.
          owner=()
          if git show "origin/$DEFAULT_BRANCH:docs/progress/features.json" > "$RUNNER_TEMP/owner.json" 2>/dev/null; then
            owner=(--owner "$RUNNER_TEMP/owner.json")
          fi
          python3 "$RUNNER_TEMP/guardrails/check_feature_list.py" --base "$RUNNER_TEMP/base.json" --head docs/progress/features.json "${owner[@]}"
