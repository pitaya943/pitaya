# pitaya template 0.1.3 · docs/guardrails/files/agent-merge/agent-merge.yml
# Sets a "verdict" commit status on the pull request's head: success only when a
# verifier gave PASS for that exact commit and none gave FAIL.
# Copy to .github/workflows/agent-merge.yml, and check_verdict.py to .github/guardrails/check_verdict.py.
# Set the repository variable MACHINE_ACCOUNT (and VERIFIER_ACCOUNTS if the verifier
# posts as another account), then require the "verdict" status on milestone/* branches.
#
# It runs in the base branch's context (pull_request_target, issue_comment and the
# default-branch copy) and checks out only the base, so nothing in the pull request can
# change the check or the status it sets.
name: agent-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, edited, dismissed]
  issue_comment:
    types: [created, edited, deleted]

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

jobs:
  agent-merge:
    name: agent-merge
    runs-on: ubuntu-24.04
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
      - name: Check the verdict and set the status on the head commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          VERIFIERS: ${{ vars.VERIFIER_ACCOUNTS || vars.MACHINE_ACCOUNT }}
        run: |
          set -uo pipefail
          pr=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR")
          head=$(printf '%s' "$pr" | jq -r .head.sha)
          branch=$(printf '%s' "$pr" | jq -r .head.ref)
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[]' | jq -s . > "$RUNNER_TEMP/comments.json"
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR/reviews" --paginate --jq '.[]' | jq -s . > "$RUNNER_TEMP/reviews.json"
          if python3 .github/guardrails/check_verdict.py --comments "$RUNNER_TEMP/comments.json" \
              --reviews "$RUNNER_TEMP/reviews.json" --head "$head" --verifiers "$VERIFIERS" --branch "$branch"; then
            state=success; text="a verifier passed this commit"
          else
            state=failure; text="no PASS verdict for this commit"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$head" -f state="$state" -f context=verdict -f description="$text"
