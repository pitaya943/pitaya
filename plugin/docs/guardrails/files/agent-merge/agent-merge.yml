# pitaya template 0.1.10 · docs/guardrails/files/agent-merge/agent-merge.yml
# Sets a "verdict" commit status on the pull request's head: success only when a
# verifier gave PASS for that exact commit and none gave FAIL. Three kinds of pull request
# into a milestone branch pass without a verdict, on what the check proves from their commits:
# a sync PR, the milestone's report PR, and at Level 4 a cut (see the recipe).
# Copy to .github/workflows/agent-merge.yml, and check_verdict.py to .github/guardrails/check_verdict.py.
# Set the repository variable MACHINE_ACCOUNT (and VERIFIER_ACCOUNTS if the verifier
# posts as another account), then require the "verdict" status on milestone/* branches.
#
# It checks out only the base and runs the base's copy of check_verdict.py, so a pull request
# can't change the Python check that judges it. The workflow file itself is another matter:
# pull_request_target and issue_comment run the base's or the default branch's copy, but GitHub
# runs a pull_request_review event with the pull request's own copy of this file. pitaya trusts
# cooperating agents not to rewrite it (see the recipe); .github/ stays read-only in ticket PRs.
#
# A FAIL is one-way: each FAIL this workflow sees is recorded in a "verdict-fail" status on its
# commit, and read back on later runs, so editing or deleting the verdict comment doesn't erase it.
name: agent-merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  pull_request_review:
    types: [submitted, edited, dismissed]
  issue_comment:
    types: [created, edited, deleted]

# One run at a time per pull request: each run reads the comments and then writes the status,
# so two overlapping runs could let the older snapshot write last. A run still waiting when a
# newer one arrives is dropped, which is fine: every run reads everything again.
concurrency:
  group: verdict-${{ github.event.pull_request.number || github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

jobs:
  agent-merge:
    name: agent-merge
    runs-on: ubuntu-24.04
    if: github.event_name != 'issue_comment' || github.event.issue.pull_request
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.repository.default_branch }}
          fetch-depth: 0
      - name: Check the verdict and set the status on the head commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          VERIFIERS: ${{ vars.VERIFIER_ACCOUNTS || vars.MACHINE_ACCOUNT }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -uo pipefail
          api() { path=$1; shift; gh api "repos/$GITHUB_REPOSITORY/$path" "$@"; }
          pr=$(api "pulls/$PR")
          head=$(printf '%s' "$pr" | jq -r .head.sha)
          branch=$(printf '%s' "$pr" | jq -r .head.ref)
          base=$(printf '%s' "$pr" | jq -r .base.ref)
          # Fetch the PR's commits as data only (nothing from the PR is checked out or run), so the
          # check can prove a head is a PASS head plus only a merge of the base, a pure sync PR, or a
          # plan PR that is only a milestone's report or a cut.
          git fetch -q origin "+refs/pull/$PR/head:refs/remotes/pr/head" "+refs/heads/$base:refs/remotes/origin/$base"
          api "issues/$PR/comments" --paginate --jq '.[]' | jq -s . > "$RUNNER_TEMP/comments.json"
          api "pulls/$PR/reviews" --paginate --jq '.[]' | jq -s . > "$RUNNER_TEMP/reviews.json"
          # Read back the FAILs recorded earlier: for the head, and for every commit a verdict names
          # (a PASS on one of those can carry to this head). A comment deleted since isn't in
          # comments.json any more, but the status this workflow wrote for it is still on the commit.
          named=$({ echo "$head"; jq -r '.[].commit_id // empty' "$RUNNER_TEMP/reviews.json"; \
            jq -r '.[].body // ""' "$RUNNER_TEMP/comments.json" \
              | grep -oiE 'Head commit:[[:space:]]*`?[0-9a-f]{40}' | grep -oiE '[0-9a-f]{40}$'; } \
            | tr '[:upper:]' '[:lower:]' | sort -u)
          failed=""; broken=""
          for sha in $named; do
            git cat-file -e "$sha^{commit}" 2>/dev/null || continue
            seen=$(api "commits/$sha/statuses" --paginate --jq '.[] | select(.context == "verdict-fail") | .id') || broken=1
            [ -z "$seen" ] || failed="$failed,$sha"
          done
          # With issue tickets, the ticket's "Risk:" line is in the issue body; file tickets are read from the base.
          ticket=()
          if ! git cat-file -e "origin/$base:docs/tickets" 2>/dev/null; then
            num=$(printf '%s' "$branch" | sed -n 's#^ticket/\([0-9][0-9]*\).*#\1#p')
            if [ -n "$num" ] && gh issue view "$num" --repo "$GITHUB_REPOSITORY" --json body -q .body > "$RUNNER_TEMP/ticket.md"; then
              ticket=(--ticket "$RUNNER_TEMP/ticket.md")
            fi
          fi
          if python3 .github/guardrails/check_verdict.py --comments "$RUNNER_TEMP/comments.json" \
              --reviews "$RUNNER_TEMP/reviews.json" --head "$head" --verifiers "$VERIFIERS" --branch "$branch" \
              --git-dir . --base "origin/$base" --default "origin/$DEFAULT_BRANCH" \
              --failed "$failed" --record "$RUNNER_TEMP/fails.txt" "${ticket[@]}"; then
            state=success; text="a PASS for this commit or its base merge, or a sync, report or cut that needs none"
          else
            state=failure; text="no PASS verdict for this commit"
          fi
          # Record each FAIL seen for the first time, before the verdict status itself.
          for sha in $(cat "$RUNNER_TEMP/fails.txt" 2>/dev/null); do
            api "statuses/$sha" -f state=failure -f context=verdict-fail \
              -f description="A verifier reported FAIL on this commit. Kept if the comment is edited or deleted." \
              > /dev/null || broken=1
          done
          if [ -n "$broken" ]; then
            echo "FAIL agent-merge: the record of FAIL verdicts (the verdict-fail statuses) couldn't be read or written."
            echo "To fix: re-run this workflow; if it keeps failing, check that its token may read and write commit statuses."
            state=failure; text="couldn't read or write the record of FAIL verdicts"
          fi
          api "statuses/$head" -f state="$state" -f context=verdict -f description="$text" > /dev/null
