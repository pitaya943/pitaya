# pitaya template 0.1.0 · docs/guardrails/files/agent-merge/agent-merge.yml
# Sets a "verdict" commit status on the pull request's head: success only when the
# latest verdict comment for that exact commit is PASS, from a verifier account.
# Copy to .github/workflows/agent-merge.yml, and check_verdict.py to .github/guardrails/check_verdict.py.
# Set the repository variable VERIFIER_ACCOUNTS, then make the "verdict" status required on main.
name: agent-merge

on:
  pull_request:
  issue_comment:
    types: [created, edited]

permissions:
  contents: read
  pull-requests: read
  issues: read
  statuses: write

jobs:
  agent-merge:
    name: agent-merge
    runs-on: ubuntu-24.04
    if: github.event_name == 'pull_request' || github.event.issue.pull_request
    steps:
      - uses: actions/checkout@v4
      - name: Check the verdict and set the status on the head commit
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          VERIFIERS: ${{ vars.VERIFIER_ACCOUNTS }}
        run: |
          set -uo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" --jq .head.sha)
          gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate --jq '.[]' | jq -s . > "$RUNNER_TEMP/comments.json"
          if python3 .github/guardrails/check_verdict.py --comments "$RUNNER_TEMP/comments.json" --head "$head" --verifiers "$VERIFIERS"; then
            state=success; text="PASS for this commit"
          else
            state=failure; text="no PASS verdict for this commit"
          fi
          gh api "repos/$GITHUB_REPOSITORY/statuses/$head" -f state="$state" -f context=verdict -f description="$text"
