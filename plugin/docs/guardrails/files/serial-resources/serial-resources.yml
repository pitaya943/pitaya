# pitaya template 0.1.0 · docs/guardrails/files/serial-resources/serial-resources.yml
# Fails a pull request whose ticket claims a serial resource another open pull request's ticket also claims.
# Copy to .github/workflows/serial-resources.yml, and check_serial.py to .github/guardrails/check_serial.py.
# Set the repository variables MACHINE_ACCOUNT (the agents' login) and OWNER_ACCOUNTS (the Owner's), then
# make the "serial-resources" check required on main in the ruleset.
name: serial-resources

on:
  pull_request:

permissions:
  contents: read
  issues: read
  pull-requests: read

env:
  # The project's serial resources and the paths that make each one up:
  # "name=glob,glob;name=glob". A PR that changes those paths must list the resource.
  SERIAL_RESOURCES: migrations=migrations/**;lockfile=poetry.lock,package-lock.json

jobs:
  serial-resources:
    name: serial-resources
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Load the checks from the base branch
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Run the base branch's copy of each check, so a pull request can't change the check
          # that judges it. The PR's own copy is used only while the base has none yet: the PR
          # that adds this guardrail.
          mkdir -p "$RUNNER_TEMP/guardrails"
          for f in check_serial.py; do
            git show "origin/$BASE_REF:.github/guardrails/$f" > "$RUNNER_TEMP/guardrails/$f" 2>/dev/null \
              || cp ".github/guardrails/$f" "$RUNNER_TEMP/guardrails/$f"
          done
      - name: Find the ticket
        id: ticket
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          OWNER_ACCOUNTS: ${{ vars.OWNER_ACCOUNTS }}
          MACHINE_ACCOUNT: ${{ vars.MACHINE_ACCOUNT }}
        run: |
          set -euo pipefail
          fail() { echo "FAIL: $1"; echo "To fix: $2"; exit 1; }
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]' | tr -d ' '; }
          # is_owner: the PR's author is listed in OWNER_ACCOUNTS (comma separated, any case).
          is_owner() {
            [ -n "${OWNER_ACCOUNTS:-}" ] || return 1
            case ",$(lower "$OWNER_ACCOUNTS")," in *",$(lower "$PR_AUTHOR"),"*) return 0;; esac
            return 1
          }
          # find_ticket <branch> <output file>. When docs/tickets/ exists on the base branch,
          # tickets are files and only a file there counts; otherwise the open GitHub issue
          # numbered in ticket/<number>-<slug>. A done or closed ticket can't be claimed.
          find_ticket() {
            if git cat-file -e "origin/$BASE_REF:docs/tickets" 2>/dev/null; then
              for f in $(git ls-tree --name-only "origin/$BASE_REF" docs/tickets/ | grep '\.md$'); do
                n=$(basename "$f" .md)
                case "$1" in "ticket/$n"|"ticket/$n-"*)
                  git show "origin/$BASE_REF:$f" > "$2"
                  if grep -qiE '^Status:[[:space:]]*done' "$2"; then
                    fail "ticket $n is already done." "work on an open ticket; if $n needs more, ask the Owner for a new ticket."
                  fi
                  echo "ticket_path=$f" >> "$GITHUB_OUTPUT"
                  claimed "$n"
                  return 0;;
                esac
              done
              return 1
            fi
            num=$(printf '%s' "$1" | sed -n 's#^ticket/\([0-9][0-9]*\).*#\1#p')
            [ -n "$num" ] || return 1
            state=$(gh issue view "$num" --repo "$GITHUB_REPOSITORY" --json state -q .state)
            [ "$state" = "OPEN" ] || fail "issue #$num is $state." "work on an open ticket issue."
            gh issue view "$num" --repo "$GITHUB_REPOSITORY" --json body -q .body > "$2"
            claimed "$num"
          }
          # claimed <id>: fail when another open PR already works on the same ticket.
          claimed() {
            [ -n "${PR_NUMBER:-}" ] || return 0
            others=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number,headRefName \
              --jq ".[] | select(.number != $PR_NUMBER) | .headRefName" | grep -E "^ticket/$1(-|\$)" || true)
            [ -z "$others" ] || fail "another open PR already works on ticket $1: $others." "one ticket, one PR: close one of them."
          }
          # A plan PR (plan/<slug>) adds ticket files for the Owner to merge; it may touch
          # only ticket and planning files, and the ticket checks don't apply to it.
          if [ "${HEAD_REF#plan/}" != "$HEAD_REF" ]; then
            other=$(git diff --name-only "origin/$BASE_REF...HEAD" \
              | grep -vE '^(docs/(tickets|milestones)/[^/]+\.md|docs/agents/(glossary|architecture)\.md|docs/decisions\.md)$' || true)
            if [ -n "$other" ]; then
              echo "FAIL: a plan PR may change only docs/tickets/*.md, docs/milestones/*.md, the glossary, the architecture map and docs/decisions.md. It also changes:"
              printf '  %s\n' $other
              echo "To fix: move those changes to a ticket branch, ticket/<id>-<slug>."
              exit 1
            fi
            echo "This is a plan PR: only ticket and planning files changed, so ticket checks don't apply."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif find_ticket "$HEAD_REF" "$RUNNER_TEMP/ticket.md"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif is_owner; then
            echo "Opened by an Owner account ($PR_AUTHOR) from a branch without a ticket: nothing to check."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ -z "${OWNER_ACCOUNTS:-}" ]; then
            fail "the repository variable OWNER_ACCOUNTS is not set, so an Owner's PR can't be told from an agent's." \
              "set OWNER_ACCOUNTS (Settings, Secrets and variables, Actions, Variables) to the Owner's login."
          else
            fail "the branch $HEAD_REF names no open ticket, and $PR_AUTHOR isn't listed in OWNER_ACCOUNTS." \
              "name the branch ticket/<id>-<slug> after an open ticket: docs/tickets/<id>.md on $BASE_REF, or issue <id>."
          fi
      - name: Collect the other open pull requests' tickets
        if: steps.ticket.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ github.base_ref }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # find_ticket <branch> <output file>: docs/tickets/<id>.md from the base branch,
          # or the GitHub issue numbered in ticket/<number>-<slug>.
          find_ticket() {
            if [ -d docs/tickets ]; then
              for f in docs/tickets/*.md; do
                n=$(basename "$f" .md)
                case "$1" in "ticket/$n"|"ticket/$n-"*)
                  git show "origin/$BASE_REF:$f" > "$2"
                  echo "ticket_path=$f" >> "$GITHUB_OUTPUT"
                  return 0;;
                esac
              done
            fi
            num=$(printf '%s' "$1" | sed -n 's#^ticket/\([0-9][0-9]*\).*#\1#p')
            [ -n "$num" ] || return 1
            gh issue view "$num" --repo "$GITHUB_REPOSITORY" --json body -q .body > "$2"
          }
          mkdir -p "$RUNNER_TEMP/others"
          gh pr list --repo "$GITHUB_REPOSITORY" --state open --json number,headRefName \
            --jq ".[] | select(.number != $PR) | \"\\(.number) \\(.headRefName)\"" |
          while read -r n ref; do find_ticket "$ref" "$RUNNER_TEMP/others/pr-$n.md" || true; done
      - name: Check serial resources
        if: steps.ticket.outputs.skip != 'true'
        run: >-
          python3 "$RUNNER_TEMP/guardrails/check_serial.py"
          --ticket "$RUNNER_TEMP/ticket.md"
          --others "$RUNNER_TEMP/others"
          --resources "$SERIAL_RESOURCES"
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"
