# pitaya template 0.1.0 · docs/guardrails/files/done-when/done-when.yml
# Fails a pull request when a test its ticket lists under "## Test IDs" is missing or not passing.
# Copy to .github/workflows/done-when.yml, and check_done_when.py to .github/guardrails/check_done_when.py.
# Set the repository variable MACHINE_ACCOUNT to the agents' GitHub login, then
# make the "done-when" check required on main in the ruleset.
name: done-when

on:
  pull_request:

permissions:
  contents: read
  issues: read
  pull-requests: read

env:
  # The test command, writing JUnit XML to "$JUNIT". For pytest:
  #   python -m pytest -q --junitxml="$JUNIT"
  TEST_COMMAND: python -m pytest -q --junitxml="$JUNIT"

jobs:
  done-when:
    name: done-when
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # Add the setup steps the test command needs here (a runtime, dependencies).
      - name: Find the ticket
        id: ticket
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          MACHINE_ACCOUNT: ${{ vars.MACHINE_ACCOUNT }}
        run: |
          set -euo pipefail
          # find_ticket <branch> <output file>: docs/tickets/<id>.md from the base branch,
          # or the GitHub issue numbered in ticket/<number>-<slug>.
          find_ticket() {
            if [ -d docs/tickets ]; then
              for f in docs/tickets/*.md; do
                n=$(basename "$f" .md)
                case "$1" in "ticket/$n"|"ticket/$n-"*)
                  git show "origin/$BASE_REF:$f" > "$2"
                  echo "ticket_path=$f" >> "$GITHUB_OUTPUT"
                  return 0;;
                esac
              done
            fi
            num=$(printf '%s' "$1" | sed -n 's#^ticket/\([0-9][0-9]*\).*#\1#p')
            [ -n "$num" ] || return 1
            gh issue view "$num" --repo "$GITHUB_REPOSITORY" --json body -q .body > "$2"
          }
          # A plan PR (plan/<slug>) adds ticket files for the Owner to merge; it may touch
          # only ticket and planning files, and the ticket checks don't apply to it.
          if [ "${HEAD_REF#plan/}" != "$HEAD_REF" ]; then
            other=$(git diff --name-only "origin/$BASE_REF...HEAD" \
              | grep -vE '^(docs/tickets/[^/]+\.md|docs/agents/(glossary|architecture)\.md|docs/decisions\.md)$' || true)
            if [ -n "$other" ]; then
              echo "FAIL: a plan PR may change only docs/tickets/*.md, the glossary, the architecture map and docs/decisions.md. It also changes:"
              printf '  %s\n' $other
              echo "To fix: move those changes to a ticket branch, ticket/<id>-<slug>."
              exit 1
            fi
            echo "This is a plan PR: only ticket and planning files changed, so ticket checks don't apply."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif find_ticket "$HEAD_REF" "$RUNNER_TEMP/ticket.md"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif [ "$PR_AUTHOR" != "$MACHINE_ACCOUNT" ]; then
            echo "Not a ticket branch and not opened by the machine account: nothing to check."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "FAIL: the branch $HEAD_REF doesn't name a ticket."
            echo "To fix: name the branch ticket/<issue number>-<slug>, or ticket/<id>-<slug> for docs/tickets/<id>.md."
            exit 1
          fi
      - name: Run the tests on the PR
        if: steps.ticket.outputs.skip != 'true'
        run: JUNIT="$RUNNER_TEMP/head.xml" bash -c "$TEST_COMMAND" || true
      - name: Check the done-when tests
        if: steps.ticket.outputs.skip != 'true'
        run: >-
          python3 .github/guardrails/check_done_when.py
          --junit "$RUNNER_TEMP/head.xml"
          --ticket "$RUNNER_TEMP/ticket.md"
