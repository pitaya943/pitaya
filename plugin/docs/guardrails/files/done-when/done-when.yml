# pitaya template 0.1.10 · docs/guardrails/files/done-when/done-when.yml
# Fails a pull request when a test its ticket lists under "## Test IDs" is missing or not passing.
# Copy to .github/workflows/done-when.yml, and check_done_when.py to .github/guardrails/check_done_when.py.
# Set the repository variable MACHINE_ACCOUNT to the agents' login (comma separated for several), then
# make the "done-when" check required on main in the ruleset.
name: done-when

on:
  pull_request:

# The pull request's tests run in their own job, so its code can't touch the check;
# the check runs the base branch's copy.
permissions:
  contents: read
  issues: read
  pull-requests: read

# The tests are run by .github/scripts/test.sh, the one place the project's test command is written
# (`/setup` installs it). For this check the command there must write JUnit XML to "$JUNIT" when
# that is set; for pytest: python -m pytest -q ${JUNIT:+--junitxml="$JUNIT"}

jobs:
  ticket:
    name: find the ticket
    runs-on: ubuntu-24.04
    outputs:
      skip: ${{ steps.ticket.outputs.skip }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        with:
          fetch-depth: 0
      - name: Find the ticket
        id: ticket
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MACHINE_ACCOUNT: ${{ vars.MACHINE_ACCOUNT }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          fail() { echo "FAIL: $1"; echo "To fix: $2"; exit 1; }
          lower() { printf '%s' "$1" | tr '[:upper:]' '[:lower:]' | tr -d ' '; }
          # is_agent: the PR's author is listed in MACHINE_ACCOUNT (comma separated, any case).
          is_agent() {
            case ",$(lower "$MACHINE_ACCOUNT")," in *",$(lower "$PR_AUTHOR"),"*) return 0;; esac
            return 1
          }
          [ -n "${MACHINE_ACCOUNT:-}" ] || fail "the repository variable MACHINE_ACCOUNT is not set, so agents' PRs can't be told from people's." \
            "set MACHINE_ACCOUNT (Settings, Secrets and variables, Actions, Variables) to the agents' login."
          # ticket_of <branch> <output file>: write the ticket the branch names to the file. When
          # docs/tickets/ exists on the base branch, tickets are files and only a file there counts;
          # otherwise it is the GitHub issue numbered in ticket/<number>-<slug>. Sets TICKET_ID,
          # TICKET_PATH (empty for an issue) and TICKET_STATE: OPEN, DONE, an issue's other state, or
          # nothing when the issue can't be read. Returns 1 when the branch names no ticket.
          # This is the one lookup: the pull request's own ticket and other pull requests' go through it.
          ticket_of() {
            TICKET_ID="" TICKET_PATH="" TICKET_STATE=""
            if git cat-file -e "origin/$BASE_REF:docs/tickets" 2>/dev/null; then
              for f in $(git ls-tree --name-only "origin/$BASE_REF" docs/tickets/ | grep '\.md$'); do
                n=$(basename "$f" .md)
                case "$1" in "ticket/$n"|"ticket/$n-"*)
                  git show "origin/$BASE_REF:$f" > "$2"
                  TICKET_ID=$n TICKET_PATH=$f TICKET_STATE=OPEN
                  if grep -qiE '^Status:[[:space:]]*done' "$2"; then TICKET_STATE=DONE; fi
                  return 0;;
                esac
              done
              return 1
            fi
            TICKET_ID=$(printf '%s' "$1" | sed -n 's#^ticket/\([0-9][0-9]*\).*#\1#p')
            [ -n "$TICKET_ID" ] || return 1
            TICKET_STATE=$(gh issue view "$TICKET_ID" --repo "$GITHUB_REPOSITORY" --json state -q .state) || TICKET_STATE=""
            gh issue view "$TICKET_ID" --repo "$GITHUB_REPOSITORY" --json body -q .body > "$2" || TICKET_STATE=""
            return 0
          }
          # find_ticket <branch> <output file>: this pull request's ticket. A done or closed ticket can't be claimed.
          find_ticket() {
            ticket_of "$1" "$2" || return 1
            case "$TICKET_STATE" in
              OPEN) ;;
              DONE) fail "ticket $TICKET_ID is already done." "work on an open ticket; if $TICKET_ID needs more, ask the Owner for a new ticket.";;
              "") fail "issue #$TICKET_ID can't be read." "name the branch after an open ticket issue; re-run the check if GitHub's API failed.";;
              *) fail "issue #$TICKET_ID is $TICKET_STATE." "work on an open ticket issue.";;
            esac
            if [ -n "$TICKET_PATH" ]; then echo "ticket_path=$TICKET_PATH" >> "$GITHUB_OUTPUT"; fi
            claimed "$TICKET_ID"
          }
          # other_tickets: where OTHER_TICKETS names a directory (the serial-resources workflow sets it),
          # write there the open ticket of every open pull request numbered lower than this one, as
          # pr-<number>.md. Lower numbers only: of two pull requests that claim one resource, the one
          # opened first goes first and the later one waits. With every other pull request listed,
          # each of the two would block the other.
          other_tickets() {
            if [ -z "${OTHER_TICKETS:-}" ] || [ -z "${PR_NUMBER:-}" ]; then return 0; fi
            mkdir -p "$OTHER_TICKETS"
            gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 --json number,headRefName --jq '.[] | "\(.number) \(.headRefName)"' > "$RUNNER_TEMP/open-prs.txt" \
              || fail "the open pull requests couldn't be listed." "re-run the check."
            while read -r pr ref || [ -n "$pr" ]; do
              if [ "$pr" -ge "$PR_NUMBER" ]; then continue; fi
              if ticket_of "$ref" "$OTHER_TICKETS/pr-$pr.md"; then
                if [ "$TICKET_STATE" = OPEN ]; then continue; fi
                # Unreadable isn't the same as closed: the claim may be there, so don't pass over it.
                [ -n "$TICKET_STATE" ] || fail "the ticket of the earlier pull request #$pr ($ref) can't be read, so the check can't tell what it claims." \
                  "re-run the check if GitHub's API failed; if #$pr names an issue that doesn't exist, close it or rename its branch."
              fi
              rm -f "$OTHER_TICKETS/pr-$pr.md"
            done < "$RUNNER_TEMP/open-prs.txt"
          }
          # claimed <id>: fail when another open PR already works on the same ticket.
          claimed() {
            [ -n "${PR_NUMBER:-}" ] || return 0
            others=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 --json number,headRefName \
              --jq ".[] | select(.number != $PR_NUMBER) | .headRefName" | grep -E "^ticket/$1(-|\$)" || true)
            [ -z "$others" ] || fail "another open PR already works on ticket $1: $others." "one ticket, one PR: close one of them."
          }
          # A branch name skips the ticket checks only on the base it belongs to: a milestone PR
          # targets the default branch, a sync PR a milestone, a plan PR the default branch or a milestone.
          if [ "${HEAD_REF#milestone/}" != "$HEAD_REF" ] && [ "$BASE_REF" = "$DEFAULT_BRANCH" ]; then
            # A milestone PR (milestone/M<n> into the default branch) gathers tickets that passed these
            # checks on their way into the milestone; the Owner reviews it as a whole.
            echo "This is a milestone PR: the Owner reviews and merges it; ticket checks don't apply."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "${HEAD_REF#milestone/}" != "$HEAD_REF" ] && is_agent; then
            fail "the branch $HEAD_REF is named like a milestone, but this PR targets $BASE_REF: only a PR into $DEFAULT_BRANCH is a milestone PR." \
              "work for a milestone goes on ticket/<id>-<slug> and targets the milestone's branch; the milestone PR itself targets $DEFAULT_BRANCH."
          elif [ "${HEAD_REF#sync/}" != "$HEAD_REF" ] && [ "${BASE_REF#milestone/}" != "$BASE_REF" ]; then
            # A sync PR (sync/<slug> into milestone/M<n>) brings in what the default branch gained,
            # all of it already merged there. It passes only if its tree is exactly the base merged
            # with the newest default-branch commit it contains: any other change gives another tree.
            newest=$(git merge-base HEAD "origin/$DEFAULT_BRANCH") \
              || fail "this sync PR contains nothing from $DEFAULT_BRANCH." "merge origin/$DEFAULT_BRANCH into the sync branch."
            want=$(git merge-tree --write-tree "origin/$BASE_REF" "$newest" | head -n 1) \
              || fail "merging $DEFAULT_BRANCH into $BASE_REF conflicts." \
                 "the Owner resolves the conflict and merges with the bypass, or a ticket resolves it."
            [ "$want" = "$(git rev-parse 'HEAD^{tree}')" ] \
              || fail "this sync PR changes more than merging $DEFAULT_BRANCH into $BASE_REF." \
                 "recreate it from $BASE_REF with only origin/$DEFAULT_BRANCH merged in; move other changes to a ticket."
            # The tree isn't enough: `git merge -s ours` keeps it and still records a commit as merged,
            # so that commit's changes would be dropped when it reaches $DEFAULT_BRANCH later. Every commit
            # the PR adds must be a true merge: two parents, and the tree git gets by merging them.
            git rev-list --parents HEAD "^origin/$BASE_REF" "^origin/$DEFAULT_BRANCH" | while read -r c p1 p2 more; do
              if [ -z "${p2:-}" ] || [ -n "${more:-}" ]; then exit 1; fi
              t=$(git merge-tree --write-tree "$p1" "$p2" | head -n 1) || exit 1
              [ "$t" = "$(git rev-parse "$c^{tree}")" ] || exit 1
            done || fail "this sync PR has a commit that isn't a plain merge (a change, or a merge whose tree isn't the merge of its parents)." \
                 "recreate it from $BASE_REF with a plain git merge of origin/$DEFAULT_BRANCH: no strategy option, no edits."
            echo "This is a sync PR: it only merges $DEFAULT_BRANCH ($(git rev-parse --short "$newest")) into $BASE_REF, so ticket checks don't apply."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif [ "${HEAD_REF#plan/}" != "$HEAD_REF" ]; then
            # A plan PR (plan/<slug>) adds ticket files for the Owner to merge; it may touch only
            # ticket and planning files, and the ticket checks don't apply to it.
            case "$BASE_REF" in
              "$DEFAULT_BRANCH"|milestone/*) ;;
              *) fail "a plan PR targets $DEFAULT_BRANCH (or a milestone branch, for its report or a cut made inside it), not $BASE_REF." \
                   "open the plan PR into $DEFAULT_BRANCH; changes for a ticket go on its ticket/<id>-<slug> branch.";;
            esac
            other=$(git diff --name-only "origin/$BASE_REF...HEAD" \
              | grep -vE '^(docs/(tickets|milestones|adr|reports)/[^/]+\.md|docs/agents/(glossary|architecture)\.md|docs/decisions\.md)$' || true)
            if [ -n "$other" ]; then
              echo "FAIL: a plan PR may change only docs/tickets/*.md, docs/milestones/*.md, docs/adr/*.md, docs/reports/*.md, the glossary, the architecture map and docs/decisions.md. It also changes:"
              printf '  %s\n' $other
              echo "To fix: move those changes to a ticket branch, ticket/<id>-<slug>."
              exit 1
            fi
            # A plan PR adds tickets and may re-plan open ones. It can't change a finished ticket (a record),
            # or a ticket an open PR is building: its scope and conditions don't move under the builder.
            for f in $(git diff --name-only --no-renames --diff-filter=MD "origin/$BASE_REF...HEAD" -- docs/tickets/ | grep '\.md$' || true); do
              n=$(basename "$f" .md)
              # A ticket is marked done on its milestone's branch first, so look there as well as on the base.
              for ref in "origin/$BASE_REF" $(git for-each-ref --format='%(refname:short)' 'refs/remotes/origin/milestone/'); do
                if git show "$ref:$f" 2>/dev/null | grep -qiE '^Status:[[:space:]]*done'; then
                  fail "this plan PR changes ticket $n, which is done (on ${ref#origin/})." "leave a finished ticket as the record it is; write a new ticket for what's missing."
                fi
              done
              [ -n "${PR_NUMBER:-}" ] || continue
              others=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 1000 --json number,headRefName \
                --jq ".[] | select(.number != $PR_NUMBER) | .headRefName" | grep -E "^ticket/$n(-|\$)" || true)
              [ -z "$others" ] || fail "this plan PR changes ticket $n while an open PR is building it: $others." \
                "merge or close that PR first, or leave ticket $n as it is."
            done
            echo "This is a plan PR: only ticket and planning files changed, so ticket checks don't apply."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          elif find_ticket "$HEAD_REF" "$RUNNER_TEMP/ticket.md"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            other_tickets
          elif ! is_agent; then
            echo "Opened by $PR_AUTHOR, not an agent account, from a branch without a ticket: people review it."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            fail "the branch $HEAD_REF names no open ticket." \
              "name the branch ticket/<id>-<slug> after an open ticket: docs/tickets/<id>.md on $BASE_REF, or issue <id>."
          fi
      - name: Keep the ticket for the check
        if: steps.ticket.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ticket
          path: ${{ runner.temp }}/ticket.md
  head-tests:
    name: tests on the PR
    needs: ticket
    if: needs.ticket.outputs.skip != 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
      # Add the setup steps the test command needs here (a runtime, dependencies). Pin each action
      # by commit with its release in a comment, as above; for Python, actions/setup-python@v7:
      #   uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      # Releases before checkout v6 and setup-python v7 run on Node 20, which GitHub has deprecated.
      - name: Run the tests
        run: JUNIT="$RUNNER_TEMP/head.xml" sh .github/scripts/test.sh || true
      - name: Keep the results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: head-junit
          path: ${{ runner.temp }}/head.xml
          if-no-files-found: ignore
  done-when:
    name: done-when
    needs: [ticket, head-tests]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    steps:
      - name: Require a ticket
        env:
          RESULT: ${{ needs.ticket.result }}
          SKIP: ${{ needs.ticket.outputs.skip }}
        run: |
          if [ "$RESULT" != "success" ]; then echo "FAIL: the find-the-ticket job failed; its log says why."; exit 1; fi
          if [ "$SKIP" = "true" ]; then echo "Nothing to check: see the find-the-ticket job."; fi
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803  # v6.1.0
        if: needs.ticket.outputs.skip != 'true'
        with:
          fetch-depth: 0
      - name: Load the checks from the base branch
        if: needs.ticket.outputs.skip != 'true'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          # Run the base branch's copy of each check, so a pull request can't change the check
          # that judges it. The PR's own copy is used only while the base has none yet: the PR
          # that adds this guardrail.
          mkdir -p "$RUNNER_TEMP/guardrails"
          for f in check_done_when.py; do
            git show "origin/$BASE_REF:.github/guardrails/$f" > "$RUNNER_TEMP/guardrails/$f" 2>/dev/null \
              || cp ".github/guardrails/$f" "$RUNNER_TEMP/guardrails/$f"
          done
      - name: Collect the results
        if: needs.ticket.outputs.skip != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          path: ${{ runner.temp }}/results
      - name: Check
        if: needs.ticket.outputs.skip != 'true'
        run: >-
          python3 "$RUNNER_TEMP/guardrails/check_done_when.py"
          --junit "$RUNNER_TEMP/results/head-junit/head.xml"
          --ticket "$RUNNER_TEMP/results/ticket/ticket.md"
